# =============================================================================
# ANSIBLE INVENTORY
# =============================================================================
# 
# This inventory file defines hosts and variables for the Ansible playbook.
# For local provisioning, we use 'localhost' with local connection.
#
# =============================================================================

[local]
localhost ansible_connection=local

[local:vars]
# Ubuntu 24.04 LTS specific variables
ansible_python_interpreter=/usr/bin/python3
