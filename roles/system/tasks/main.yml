---
# =============================================================================
# SYSTEM ROLE - Core system updates and base packages
# =============================================================================
#
# This role handles:
# - System package updates
# - Installation of base development packages
# - Build tools and compilers
# - Version managers (asdf, rustup)
#
# =============================================================================

- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - system
    - packages

- name: Upgrade all packages
  apt:
    upgrade: full
    autoclean: yes
    autoremove: yes
  tags:
    - system
    - packages

- name: Install base packages
  apt:
    name: "{{ item }}"
    state: present
  loop:
    # CLI tools
    - bat
    - btop
    - ca-certificates
    - curl
    - eza
    - net-tools
    - p7zip-full
    - pass
    - pwgen
    - unrar
    - wget
    - git
    - tig
  tags:
    - system
    - packages

- name: Install build essentials and development libraries
  apt:
    name: "{{ item }}"
    state: present
  loop:
    # Build tools
    - build-essential
    - cmake
    - gcc
    - make
    - pkg-config
    
    # Development libraries
    - libssl-dev
    - libreadline-dev
    - libsqlite3-dev
    - zlib1g-dev
    - libbz2-dev
    - libncursesw5-dev
    - libffi-dev
    - liblzma-dev
    - libxml2-dev
    - libxmlsec1-dev
    - tk-dev
    - xz-utils
  tags:
    - system
    - packages

- name: Install Python development packages
  apt:
    name: "{{ item }}"
    state: present
  loop:
    - python3-dev
    - python3-pip
    - python3-venv
    - pipx
  tags:
    - system
    - packages

- name: Create ~/.local/bin directory
  file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: '0755'
  tags:
    - system

- name: Install asdf version manager
  block:
    - name: Check if asdf is installed
      stat:
        path: "{{ ansible_env.HOME }}/.asdf"
      register: asdf_dir

    - name: Clone asdf repository
      git:
        repo: https://github.com/asdf-vm/asdf.git
        dest: "{{ ansible_env.HOME }}/.asdf"
        version: v0.14.0
      when: not asdf_dir.stat.exists

    - name: Add asdf to PATH in bashrc
      lineinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        line: "export PATH=\"$HOME/.asdf/bin:$PATH\""
        create: yes
      when: not asdf_dir.stat.exists
  tags:
    - system
    - version_manager

- name: Install Rust toolchain
  block:
    - name: Check if Rust is installed
      command: rustc --version
      register: rustc_installed
      changed_when: false
      failed_when: false

    - name: Download and run Rust installer
      shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      when: rustc_installed.rc != 0
  tags:
    - system
    - rust

- name: Display system role completion
  debug:
    msg: "✔ System role completed successfully"
  tags:
    - system
